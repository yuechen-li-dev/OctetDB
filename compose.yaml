services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dbsched
      POSTGRES_USER: dbsched
      POSTGRES_PASSWORD: dbsched
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbsched -d dbsched"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

